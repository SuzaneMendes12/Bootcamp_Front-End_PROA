<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HTML semantica</title>

    <link
      rel="icon"
      href="https://img.magnific.com/vetores-gratis/vetor-de-
     gradiente-de-logotipo-colorido-de-passaro_343694-1365.jpg?semt=ais_hybrid&w=740&q=80"
      type="image/png"/>
  </head>

  <body>
    <!-- Cabeçalho -->

    <header>
      <img
        src="https://img.magnific.com/vetores-gratis/vetor-de-gradiente-de-logotipo-
        colorido-de-passaro_343694-1365.jpg?semt=ais_hybrid&w=740&q=80"alt="logo do meu site" width="80"/>

      <!-- navegação -->
      <nav>
        <!-- lista n ordenada -->
        <ul>
          <!-- itens da lista -->
          <li>inicio</li>
          <li>Quem somos</li>
          <li>Produtos</li>
          <li>Contato</li>
        </ul>
      </nav>
    </header>

    <!-- COnteudo principal - unico -->
    <main>
      <!-- seções tematicas -->
      <section>
        <!-- unica por pag -->
        <h1>Titulo principal</h1>
      </section>

      <section>
        <h2>titulo da seção</h2>
        <p>texto da seção</p>
      </section>

      <section>
        <h2>Titulo da seção</h2>
        <p>texto da seção</p>

        <!-- conteudo independente -->
        <article>
          <h3>nome de produto</h3>
          <p>preço R$ 0,00</p>
          <p>Descrição</p>
        </article>
        
      </section>
    </main>

    <!-- Rodapé -->
    <footer>
       <div>
          <img
             src="https://img.magnific.com/vetores-gratis/vetor-de-gradiente-de-logotipo-
             colorido-de-passaro_343694-1365.jpg?semt=ais_hybrid&w=740&q=80" alt="logo do meu site"width="150"/>

         <div>
            <a>Home</a>
            <a> Fale conosco </a>
            <a> Produtos </a>
         </div>
      </div>

      <!-- linha de divisao -->
      <hr/>

      <!-- texto pequeno -->
      <small>
        @Copyright site criado por Suzane Mendes -
        <a> Linkedin </a>
        <a> Instagram </a>
        <a> Whatsapp </a>
      </small>

    </footer>

  </body>
</html>
