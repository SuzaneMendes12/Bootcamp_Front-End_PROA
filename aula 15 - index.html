  <body>

    <section>
       
     <!-- TAgs de acessibilidade - O atributo scope="col" ou scope="row" diz aos Leitores de Ecrã se aquele cabeçalho
     (<th>) manda numa coluna inteira ou numa linha inteira. Isto ajuda pessoas com deficiência visual a não se perderem na grelha do Benson!
     scope="col" ou scope="row" → define a relação entre cabeçalhos e dados (acessibilidade). -->

      <table>
        <!-- titulo tabela -->
        <caption>
          Lista de produtos para vender
        </caption>

        <!-- Cabeçalho -->
        <thead>
          <tr>
            <th scope="col">Nome</th>
            <th scope="col">Observação</th>
            <th scope="col">Nota</th>
            <th scope="col">Preço</th>
          </tr>
        </thead>

        <!-- Corpo -->
        <tbody>
          <tr>
            <td scope="row">caneta</td>
            <td>Kit com 5</td>
            <td>*****</td>
            <td>R$ 1,50</td>
          </tr>

          <tr>
            <td scope="row">Miojo turma da monica</td>
            <td>Bem temperado e original</td>
            <td>**</td>
            <td>R$ 8</td>
          </tr>

          <tr>
            <!-- colspan="n" → célula ocupa várias colunas. 
             rowspan="n" → célula ocupa várias linhas. -->
            <td rowspan="2" scope="row">Relogio do Ben 10</td>
            <td>O novo</td>
            <td>**</td>
            <td>R$ 10,00</td>
          </tr>
          
          <tr>
            <td>O velho</td>
            <td>****</td>
            <td>R$ 12,00</td>
          </tr>
        </tbody>

        <!-- Rodapé -->
        <tfoot>
          <tr>
            <th scope="row">Total</th>
            <td>R$ 31,50</td>
          </tr>
        </tfoot>

      </table>

    </section>

  </body>
</html>
