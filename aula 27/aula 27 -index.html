<!doctype html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CSS - Reponsividade e Tailwind CSS</title>
		<link rel="shortcut icon" href="https://kmitd.github.io/recoding-black-mirror/img/bm-logo2.png" type="image/x-icon" />

		<style>
			* {
				padding: 0;
				margin: 0;
				box-sizing: border-box;
			}

			a {
				color: inherit;
				text-decoration: none;
			}

			body {
				font-family: "Montserrat";
			}

			header {
				display: flex;
				background-color: rgb(63, 63, 63);
				color: white;
				height: 80px;
				padding: 0 20px;
				justify-content: space-between;
				align-items: center;
			}

			.menu-expandido {
				position: absolute;
				background-color: rgb(63, 63, 63);
				display: none;
				flex-direction: column;
				gap: 16px;
				align-items: center;
				right: 0;
				padding: 16px 8px;
				border-radius: 16px;
			}

			ul {
				display: flex;
				flex-direction: column;
				list-style: none;
				gap: 16px;
			}

			.cta {
				font-family: "Montserrat";
				background-color: rgb(146, 40, 40);
				color: white;
				border: none;
				padding: 8px 16px;
				font-weight: bold;
				border-radius: 16px;
			}

			#menu-input {
				display: none;
			}

			.hamburguer {
				font-size: 36px;
				font-weight: bold;
				padding: 8px;
				user-select: none;
				cursor: pointer;
				display: inline-block;
			}

			#menu-input:checked ~ .menu-expandido {
				display: flex;
			}

			.container-menu {
				position: relative;
			}

			@media screen and (min-width: 768px) {
				header {
					padding: 0 80px;
				}

				.hamburguer {
					display: none;
				}

				.menu-expandido {
					display: flex;
					flex-direction: row;
					gap: 36px;
					position: static;
					background-color: transparent;
				}

				ul {
					flex-direction: row;
				}
			}

			@media screen and (min-width: 1024px) {
				header {
					padding: 0 180px;
				}
			}
		</style>
	</head>
	<body>
		<header>
			<img src="#" alt="Logo" />

			<div class="container-menu">
				<input type="checkbox" id="menu-input" />
				<label for="menu-input" class="hamburguer"> ≡ </label>

				<div class="menu-expandido">
					<nav>
						<ul>
							<li>Home</li>
							<li><a href="./projetos.html">Projetos</a></li>
							<li>Sobre</li>
							<li>Contato</li>
						</ul>
					</nav>

					<button class="cta">Orçamento</button>
				</div>
			</div>
		</header>

		<main>
			<h1>Home</h1>
		</main>
	</body>
</html>
